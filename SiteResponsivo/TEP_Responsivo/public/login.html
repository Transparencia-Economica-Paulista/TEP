<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEP - Login</title>
  <link rel="icon" href="assets/icon/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/cadastro.css" />
</head>
<body>
  <header>
    <img src="assets/Logo/LogoCompleta.png" alt="TEP Logo">
    <nav>
      <a href="index.html" style=" position: absolute; z-index: 10; right: 187px; ">Início</a>
      <button class="button-login" onclick="window.location='cadastro.html'">Cadastrar</button> 
    </nav>
  </header>

  <div class="container-login">
     <img src="assets/institucional/tepinho.png" class="tepinho" alt="tepinho">
    <div class="login-section">
      <h2>Conecte-se</h2>
      <p>Bem-vindo(a) de volta!</p>
      <form class="login-form" onsubmit="return entrar()">
        <label for="email_input">Email</label>
        <input type="email" id="email_input" required>

        <label for="senha_input">Senha</label>
        <input type="password" id="senha_input" required>

        <button type="submit">Entrar</button>
        <div id="cardErro" class="mensagem" style="display: none;"></div>
      </form>
      
      <div style="text-align: center; margin-top: 20px;">
        <p>Não tem uma conta? <a href="cadastro.html" style="color: var(--cor-primaria); text-decoration: none;">Cadastre-se aqui</a></p>
      </div>
    </div>


  </div>

<script>
function entrar() {
    var emailVar = email_input.value.trim();
    var senhaVar = senha_input.value;

    if (emailVar === "" || senhaVar === "") {
        exibirErro("Preencha todos os campos!");
        return false;
    }

    fetch("/usuarios/autenticar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            emailServer: emailVar,
            senhaServer: senhaVar
        })
    })
    .then(async resposta => {
        if (resposta.ok) {
            const usuario = await resposta.json();
            sessionStorage.EMAIL_USUARIO = usuario.email;
            sessionStorage.NOME_USUARIO = usuario.nome;
            sessionStorage.ID_USUARIO = usuario.id;
            sessionStorage.FK_EMPRESA = usuario.fkEmpresa;
            window.location = "./painel.html";
        } else {
            const texto = await resposta.text();
            exibirErro(texto || "Email ou senha incorretos!");
        }
    })
    .catch(erro => {
        console.error(erro);
        exibirErro("Erro interno do servidor!");
    });

    return false;
}

function exibirErro(mensagem) {
    var cardErro = document.getElementById("cardErro");
    cardErro.className = "mensagem erro";
    cardErro.style.display = "block";
    cardErro.innerHTML = mensagem;
    setTimeout(() => { cardErro.style.display = "none"; }, 4000);
}
</script>
</body>
</html>
