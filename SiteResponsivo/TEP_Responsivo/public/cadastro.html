<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEP - Cadastro de Empresa</title>
  <link rel="icon" href="assets/icon/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/cadastro.css" />
</head>
<body onload="carregarMunicipios()">
  <header>
    <img src="assets/Logo/LogoCompleta.png" alt="TEP Logo">
    <nav>
      <a href="index.html">Início</a>
      <a href="login.html">Login</a>
      <button class="button-login" onclick="window.location='cadastro.html'">Cadastrar</button>
    </nav>
  </header>

  <div class="container">
    <div class="form-section">
      <h2>Cadastre sua Empresa</h2>
      <p>Se cadastre e tenha acesso a nossa plataforma</p>
      <form id="formEmpresa" onsubmit="return cadastrarEmpresa()">
        <label for="razao_social_input">Razão Social</label>
        <input type="text" id="razao_social_input" required>

        <label for="email_empresa_input">Email</label>
        <input type="email" id="email_empresa_input" required>

        <label for="senha_empresa_input">Senha</label>
        <input type="password" id="senha_empresa_input" required>

        <label for="confirmar_senha_empresa_input">Confirmar Senha</label>
        <input type="password" id="confirmar_senha_empresa_input" required>

        <label for="cnpj_empresa_input">CNPJ</label>
        <input type="text" id="cnpj_empresa_input" required>

        <label for="municipio_select">Município</label>
        <select id="municipio_select" required>
          <option value="">Carregando municípios...</option>
        </select>

        <button type="submit">Cadastrar Empresa</button>
        <div id="mensagem_empresa" class="mensagem"></div>
      </form>
    </div>

    <div class="info-section">
      <div class="info-text">
      Informações <p>confiáveis</p> e <p>dinâmicas</p> sobre seu munícipio <p>em um só lugar</p>
      </div>
      <img src="assets/institucional/imagemCadastro.png" alt="Cadastro de Empresa" class="imagem-lateral">
    </div>
  </div>

  <script>
  async function carregarMunicipios() {
    const resposta = await fetch("/empresas/municipios");
    const municipios = await resposta.json();
    const select = document.getElementById("municipio_select");
    select.innerHTML = "";
    municipios.forEach(m => {
      const opt = document.createElement("option");
      opt.value = m.id;
      opt.text = m.nome_municipio + " (" + m.nome_regiao + ")";
      select.appendChild(opt);
    });
  }

  async function cadastrarEmpresa() {
    const razaoSocial = razao_social_input.value.trim();
    const email = email_empresa_input.value.trim();
    const senha = senha_empresa_input.value;
    const confirmar = confirmar_senha_empresa_input.value;
    const cnpj = cnpj_empresa_input.value.trim();
    const municipio = municipio_select.value;

    const msg = document.getElementById("mensagem_empresa");

    if (senha !== confirmar) {
      msg.className = "mensagem erro";
      msg.style.display = "block";
      msg.innerText = "As senhas não coincidem!";
      return false;
    }

    msg.className = "mensagem";
    msg.style.display = "block";
    msg.style.color = "black";
    msg.innerText = "Enviando...";

    const res = await fetch("/empresas/cadastrar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ 
        nome: razaoSocial, 
        email, 
        senha, 
        cnpj, 
        municipio })
    });

    if (res.ok) {
      const data = await res.json();
      msg.className = "mensagem sucesso";
      msg.innerText = "Empresa cadastrada com sucesso!";
      sessionStorage.ID_EMPRESA_CRIADA = data.insertId;
      setTimeout(() => window.location = "cadastrousuario.html", 1500);
    } else {
      const txt = await res.text();
      msg.className = "mensagem erro";
      msg.innerText = "Erro: " + txt;
    }

    return false;
  }
  </script>
</body>
</html>
