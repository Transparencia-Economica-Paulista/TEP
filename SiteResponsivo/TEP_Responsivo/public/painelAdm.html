<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEP - Painel Administrador</title>
  <link rel="stylesheet" href="css/painel.css">
  <link rel="icon" href="assets/icon/favicon.ico" type="image/x-icon">
  <script src="js/sessao.js"></script>
</head>
<body onload="verificarAcessoAdmin()">
  
  <header>
    <img src="assets/Logo/LogoCompleta.png" alt="Logo" />
    <nav>
      <a href="painelAdm.html" class="active">Painel Administrador</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="#" class="logout" onclick="limparSessao()">Sair</a>
    </nav>
  </header>

  <main class="container">
    <h1>PAINEL ADMINISTRADOR</h1>
    
    <div class="grid-cartoes">
      
      <a href="cadastrousuario.html" class="cartao">
        <div class="icone-cartao">
          <img src="assets/painel/adUser.png" alt="Adicionar funcionário">
        </div>
        <h3>Adicionar funcionário</h3>
      </a>

      <a href="perfil.html" class="cartao">
        <div class="icone-cartao">
          <img src="assets/painel/perfil.png" alt="Visualizar perfil">
        </div>
        <h3>Visualizar perfil</h3>
      </a>

       <a href="#" class="cartao">
        <div class="icone-cartao">
          <img src="assets/painel/lista.png" alt="Lista de Funcionários">
        </div>
        <h3>Lista de funcionários</h3>
      </a>

      <a href="dashboard.html" class="cartao">
        <div class="icone-cartao">
          <img src="assets/painel/dashboard 1.png" alt="Dashboard">
        </div>
        <h3>Dashboard</h3>
      </a>

      <a href="#" class="cartao">
        <div class="icone-cartao">
          <img src="assets/painel/log.png" alt="LOGS">
        </div>
        <h3>LOGS</h3>
      </a>

      <a href="#" class="cartao">
        <div class="icone-cartao">
          <img src="assets/painel/sobre.png" alt="Sobre a TEP">
        </div>
        <h3>Sobre a TEP</h3>
      </a>
      
    </div>
  </main>

  <footer>
    <div id="titulo-footer">
      <img src="assets/Logo/laranja.png" alt="Logo rodapé">
      <h3>Transparência Econômica Paulista</h3>
    </div>
    <div class="alinhar">
      <div class="alinha_footer">
        <span><a href="painelAdm.html">Painel Central</a></span>
        <span><a href="perfil.html">Perfil</a></span>
      </div>
      <div class="alinha_footer">
        <span><a href="dashboard.html">Dashboard</a></span>
        <span><a href="login.html">Sair</a></span>
      </div>
    </div>
  </footer>

  <script>
    function verificarAcessoAdmin() {
      if (!sessionStorage.IS_ADMIN || sessionStorage.IS_ADMIN != 1) {
        alert('Acesso negado! Apenas administradores podem acessar esta página.');
        window.location = "painelFunc.html";
      }
    }
  </script>
</body>
</html>
