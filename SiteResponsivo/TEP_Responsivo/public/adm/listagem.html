<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEP - Lista de Funcionários</title>
  <link rel="stylesheet" href="../css/lista.css">
  <link rel="icon" href="../assets/icon/favicon.ico" type="image/x-icon">
  <script src="../js/sessao.js"></script>
</head>
<body onload="verificarAcessoAdmin()">
  
  <header>
    <img src="../assets/Logo/LogoCompleta.png" alt="Logo" />
    <nav>
      <a href="#" onclick="voltarParaPainel()">Painel</a>
      <a href="../dashboard.html">Dashboard</a>
      <a href="#" class="logout" onclick="limparSessao()">Sair</a>
    </nav>
  </header>

  <main class="container">
    <h1>LISTA DE FUNCIONÁRIOS</h1>
    
    <div class="listagem-container">
      <div id="mensagem-listagem" style="display: none; padding: 10px; margin-bottom: 15px; border-radius: 6px; text-align: center; font-size: 14px;"></div>
      <div class="filtros">
        <input type="text" id="busca-nome" placeholder="Buscar por nome..." onkeyup="filtrarTabela()">
        <select id="filtro-tipo" onchange="filtrarTabela()">
          <option value="todos">Todos</option>
          <option value="admin">Administradores</option>
          <option value="func">Funcionários</option>
        </select>
      </div>

      <div class="tabela-wrapper">
        <table class="tabela-funcionarios">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Email</th>
              <th>Tipo</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-body">
            <tr>
              <td colspan="4" class="carregando">Carregando funcionários...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal de Confirmação de Exclusão -->
  <div id="modal-exclusao" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Confirmar Exclusão</h2>
        <span class="close" onclick="fecharModal('modal-exclusao')">&times;</span>
      </div>
      <div class="modal-body">
        <p id="mensagem-exclusao">Tem certeza que deseja excluir este funcionário?</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-cancelar" onclick="fecharModal('modal-exclusao')">Cancelar</button>
        <button class="btn btn-confirmar" onclick="confirmarExclusaoFinal()">Excluir</button>
      </div>
    </div>
  </div>

  <!-- modal ediçao do nivel de acesso -->
  <div id="modal-editar" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Editar Cargo do Funcionário</h2>
        <span class="close" onclick="fecharModal('modal-editar')">&times;</span>
      </div>
      <div class="modal-body">
        <p><strong>Funcionário:</strong> <span id="nome-funcionario-editar"></span></p>
        <div class="form-group">
          <label>Cargo:</label>
          <select id="select-cargo">
            <option value="0">Funcionário</option>
            <option value="1">Administrador</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-cancelar" onclick="fecharModal('modal-editar')">Cancelar</button>
        <button class="btn btn-confirmar" onclick="salvarEdicao()">Salvar</button>
      </div>
    </div>
  </div>

  <footer>
    <div id="titulo-footer">
      <img src="../assets/Logo/laranja.png" alt="Logo rodapé">
      <h3>Transparência Econômica Paulista</h3>
    </div>
    <div class="alinhar">
      <div class="alinha_footer">
        <span><a href="#" onclick="voltarParaPainel()">Painel</a></span>
        <span><a href="perfil.html">Perfil</a></span>
      </div>
      <div class="alinha_footer">
        <span><a href="../dashboard.html">Dashboard</a></span>
        <span><a href="../login.html">Sair</a></span>
      </div>
    </div>
  </footer>

  <script>
    // variável que guarda todos os funcionários carregados
    var todosFuncionarios = [];
    var idFuncionarioAtual = null;
    var cargoAtualFuncionario = null;

    // função que verifica se o usuário é administrador
    function verificarAcessoAdmin() {
      // Verifica se o usuário está logado
      if (!sessionStorage.EMAIL_USUARIO) {
        window.location = "../login.html";
        return;
      }
      
      // verifica se o usuário é administrador
      if (!sessionStorage.IS_ADMIN || sessionStorage.IS_ADMIN != 1) {
        alert('Acesso negado! Apenas administradores podem acessar esta página.');
        window.location = "../painelFunc.html";
        return;
      }
      
      // se passou nas verificações, carrega os funcionários
      carregarFuncionarios();
    }

    // função que volta para o painel correto
    function voltarParaPainel() {
      if (sessionStorage.IS_ADMIN == 1) {
        window.location = "painelAdm.html";
      } else {
        window.location = "../painelFunc.html";
      }
    }

    // função que mostra mensagem para o usuário
    function mostrarMensagemTela(texto, tipo) {
      var mensagemDiv = document.getElementById('mensagem-listagem');
      mensagemDiv.style.display = 'block';
      mensagemDiv.innerText = texto;
      
      // define a cor da mensagem baseado no tipo
      if (tipo == 'erro') {
        mensagemDiv.style.backgroundColor = '#ffebee';
        mensagemDiv.style.color = '#c62828';
        mensagemDiv.style.border = '2px solid #c62828';
      } else if (tipo == 'sucesso') {
        mensagemDiv.style.backgroundColor = '#e8f5e9';
        mensagemDiv.style.color = '#2e7d32';
        mensagemDiv.style.border = '2px solid #2e7d32';
      } else {
        mensagemDiv.style.backgroundColor = '#e3f2fd';
        mensagemDiv.style.color = '#1565c0';
        mensagemDiv.style.border = '2px solid #1565c0';
      }
      setTimeout(function() {
        mensagemDiv.style.display = 'none';
      }, 4000);
    }

    // Função que busca os funcionários no servidor
    function carregarFuncionarios() {
      var fkEmpresa = sessionStorage.FK_EMPRESA;
      
      // Verifica se tem empresa na sessão
      if (!fkEmpresa) {
        mostrarErroTabela('Empresa não identificada');
        return;
      }

      // Busca os funcionários da empresa
      fetch('/usuarios/listar/' + fkEmpresa)
        .then(function(resposta) {
          if (resposta.ok == true) {
            return resposta.json();
          } else {
            throw new Error('Erro ao buscar funcionários');
          }
        })
        .then(function(funcionarios) {
          todosFuncionarios = funcionarios;
          
          // Verifica se encontrou funcionários
          if (funcionarios.length == 0) {
            mostrarMensagemTabela('Nenhum funcionário cadastrado nesta empresa.');
          } else {
            desenharTabela(funcionarios);
          }
        })
        .catch(function(erro) {
          console.error('Erro:', erro);
          mostrarErroTabela('Erro ao carregar funcionários. Tente novamente.');
        });
    }

    // Função que desenha a tabela com os funcionários
    function desenharTabela(funcionarios) {
      var tbody = document.getElementById('tabela-body');
      
      // Verifica se tem funcionários para mostrar
      if (funcionarios.length == 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="sem-dados">Nenhum funcionário encontrado</td></tr>';
        return;
      }

      // Limpa a tabela
      tbody.innerHTML = '';
      
      // Percorre cada funcionário e cria uma linha na tabela
      for (var i = 0; i < funcionarios.length; i++) {
        var func = funcionarios[i];
        
        // Define o nome (se não tiver, mostra N/A)
        var nome = func.nome ? func.nome : 'N/A';
        var email = func.email ? func.email : 'N/A';
        
        // Define o tipo (administrador ou funcionário)
        var tipo = '';
        var classeBadge = '';
        if (func.adm == 1) {
          tipo = 'Administrador';
          classeBadge = 'badge-admin';
        } else {
          tipo = 'Funcionário';
          classeBadge = 'badge-func';
        }
        
        // Monta o HTML da linha
        var linhaHTML = '<tr>' +
          '<td>' + nome + '</td>' +
          '<td>' + email + '</td>' +
          '<td><span class="badge ' + classeBadge + '">' + tipo + '</span></td>' +
          '<td>' +
            '<button class="btn-acao btn-editar" onclick="editarFuncionario(' + func.id + ')" title="Editar">' +
              '<svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">' +
                '<path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/>' +
              '</svg>' +
            '</button>' +
            '<button class="btn-acao btn-deletar" onclick="confirmarExclusao(' + func.id + ', \'' + func.nome + '\')" title="Excluir">' +
              '<svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">' +
                '<path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>' +
                '<path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>' +
              '</svg>' +
            '</button>' +
          '</td>' +
        '</tr>';
        
        tbody.innerHTML = tbody.innerHTML + linhaHTML;
      }
    }

    // Função que filtra a tabela baseado no nome e tipo
    function filtrarTabela() {
      var buscaNome = document.getElementById('busca-nome').value.toLowerCase();
      var filtroTipo = document.getElementById('filtro-tipo').value;

      var funcionariosFiltrados = [];
      
      // Percorre todos os funcionários e verifica se passa no filtro
      for (var i = 0; i < todosFuncionarios.length; i++) {
        var func = todosFuncionarios[i];
        
        // Verifica se o nome contém o texto buscado
        var passaNome = func.nome.toLowerCase().indexOf(buscaNome) >= 0;
        
        // Verifica se o tipo é o selecionado
        var passaTipo = true;
        if (filtroTipo == 'admin') {
          passaTipo = func.adm == 1;
        } else if (filtroTipo == 'func') {
          passaTipo = func.adm == 0;
        }

        // Se passou nos dois filtros, adiciona na lista
        if (passaNome == true && passaTipo == true) {
          funcionariosFiltrados.push(func);
        }
      }

      // Redesenha a tabela com os funcionários filtrados
      desenharTabela(funcionariosFiltrados);
    }

    // Função que abre o modal de edição
    function editarFuncionario(id) {
      // Busca o funcionário na lista
      var funcionario = null;
      for (var i = 0; i < todosFuncionarios.length; i++) {
        if (todosFuncionarios[i].id == id) {
          funcionario = todosFuncionarios[i];
          break;
        }
      }
      
      if (!funcionario) {
        return;
      }

      // Guarda o id e cargo atual
      idFuncionarioAtual = id;
      cargoAtualFuncionario = funcionario.adm;
      
      // Preenche o modal com os dados
      document.getElementById('nome-funcionario-editar').textContent = funcionario.nome;
      document.getElementById('select-cargo').value = funcionario.adm;
      
      // Abre o modal
      abrirModal('modal-editar');
    }

    // Função que salva a edição do cargo
    function salvarEdicao() {
      var novoCargo = parseInt(document.getElementById('select-cargo').value);
      
      // Se não mudou o cargo, só fecha o modal
      if (novoCargo == cargoAtualFuncionario) {
        fecharModal('modal-editar');
        return;
      }

      // Envia a atualização para o servidor
      fetch('/usuarios/atualizarCargo/' + idFuncionarioAtual, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ adm: novoCargo })
      })
      .then(function(resposta) {
        if (resposta.ok == true) {
          mostrarMensagemTela('Cargo atualizado com sucesso!', 'sucesso');
          fecharModal('modal-editar');
          carregarFuncionarios();
        } else {
          mostrarMensagemTela('Erro ao atualizar cargo', 'erro');
        }
      })
      .catch(function(erro) {
        console.error('Erro:', erro);
        mostrarMensagemTela('Erro ao atualizar cargo', 'erro');
      });
    }

    // Função que abre o modal de confirmação de exclusão
    function confirmarExclusao(id, nome) {
      idFuncionarioAtual = id;
      document.getElementById('mensagem-exclusao').innerHTML = 
        'Tem certeza que deseja excluir o funcionário <strong>' + nome + '</strong>?';
      abrirModal('modal-exclusao');
    }

    // Função que confirma a exclusão
    function confirmarExclusaoFinal() {
      excluirFuncionario(idFuncionarioAtual);
      fecharModal('modal-exclusao');
    }

    // Função que exclui o funcionário
    function excluirFuncionario(id) {
      fetch('/usuarios/deletar/' + id, {
        method: 'DELETE'
      })
      .then(function(resposta) {
        if (resposta.ok == true) {
          mostrarMensagemTela('Funcionário excluído com sucesso!', 'sucesso');
          carregarFuncionarios();
        } else {
          mostrarMensagemTela('Erro ao excluir funcionário', 'erro');
        }
      })
      .catch(function(erro) {
        console.error('Erro:', erro);
        mostrarMensagemTela('Erro ao excluir funcionário', 'erro');
      });
    }

    // Função que abre um modal
    function abrirModal(modalId) {
      document.getElementById(modalId).style.display = 'flex';
    }

    // Função que fecha um modal
    function fecharModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    // Quando clicar fora do modal, fecha ele
    window.onclick = function(event) {
      if (event.target.classList.contains('modal') == true) {
        event.target.style.display = 'none';
      }
    }

    // Função que mostra erro na tabela
    function mostrarErroTabela(mensagem) {
      document.getElementById('tabela-body').innerHTML = 
        '<tr><td colspan="4" class="erro">' + mensagem + '</td></tr>';
    }

    // Função que mostra mensagem na tabela
    function mostrarMensagemTabela(mensagem) {
      document.getElementById('tabela-body').innerHTML = 
        '<tr><td colspan="4" class="sem-dados">' + mensagem + '</td></tr>';
    }
  </script>
</body>
</html>
