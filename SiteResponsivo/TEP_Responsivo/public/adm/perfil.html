<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEP - Perfil</title>
  <link rel="stylesheet" href="../css/perfil.css">
  <link rel="icon" href="../assets/icon/favicon.ico" type="image/x-icon">
  <style>
    .container {
      min-height: calc(100vh - 300px);
    }
  </style>
  <script src="../js/sessao.js"></script>
</head>
<body onload="verificarSessaoPerfil()">
  
  <header>
    <img src="../assets/Logo/LogoCompleta.png" alt="Logo" />
    <nav>
      <a href="#" onclick="voltarParaPainel()">Painel</a>
      <a href="../dashboard.html">Dashboard</a>
      <a href="#" class="logout" onclick="limparSessao()">Sair</a>
    </nav>
  </header>

  <main class="container">
    <h1>PERFIL DO USUÁRIO</h1>
    
    <div class="perfil-card">
      <div class="perfil-foto">
        <img src="../assets/painel/tepinhoPerfil.png" alt="Foto do usuário" id="foto-perfil">
      </div>
      
      <div class="perfil-info">
        <div class="info-item">
          <label>Nome:</label>
          <p id="nome-usuario">Carregando...</p>
        </div>
        
        <div class="info-item">
          <label>Email:</label>
          <p id="email-usuario">Carregando...</p>
        </div>
        
        <div class="info-item">
          <label>Nível de acesso:</label>
          <p id="tipo-usuario">Carregando...</p>
        </div>
        
        <div class="info-item">
          <label>Empresa:</label>
          <p id="nome-empresa">Carregando...</p>
        </div>
        
        <div class="info-item">
          <label>CNPJ:</label>
          <p id="cnpj-empresa">Carregando...</p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div id="titulo-footer">
      <img src="../assets/Logo/laranja.png" alt="Logo rodapé">
      <h3>Transparência Econômica Paulista</h3>
    </div>
    <div class="alinhar">
      <div class="alinha_footer">
        <span><a href="#" onclick="voltarParaPainel()">Painel</a></span>
        <span><a href="perfil.html">Perfil</a></span>
      </div>
      <div class="alinha_footer">
        <span><a href="../dashboard.html">Dashboard</a></span>
        <span><a href="../login.html">Sair</a></span>
      </div>
    </div>
  </footer>

  <script>
    function verificarSessaoPerfil() {
      if (!sessionStorage.EMAIL_USUARIO) {
        window.location = "../login.html";
        return;
      }
      carregarDadosPerfil();
    }

    function voltarParaPainel() {
      if (sessionStorage.IS_ADMIN == 1) {
        window.location = "painelAdm.html";
      } else {
        window.location = "../painelFunc.html";
      }
    }

    async function carregarDadosPerfil() {
      try {
        // Carregar dados do usuário da sessão
        const nome = sessionStorage.NOME_USUARIO || 'Usuário';
        const email = sessionStorage.EMAIL_USUARIO || 'email@exemplo.com';
        const fkEmpresa = sessionStorage.FK_EMPRESA;
        
        document.getElementById('nome-usuario').textContent = nome;
        document.getElementById('email-usuario').textContent = email;
        
        // Definir tipo de usuário
        const isAdmin = sessionStorage.IS_ADMIN == 1;
        document.getElementById('tipo-usuario').textContent = isAdmin ? 'Administrador' : 'Funcionário';
        
        // Buscar dados da empresa
        if (fkEmpresa) {
          const response = await fetch(`/empresas/buscar/${fkEmpresa}`);
          if (response.ok) {
            const empresa = await response.json();
            if (empresa && empresa.length > 0) {
              document.getElementById('nome-empresa').textContent = empresa[0].razao_social || 'N/A';
              document.getElementById('cnpj-empresa').textContent = formatarCNPJ(empresa[0].cnpj) || 'N/A';
            } else {
              document.getElementById('nome-empresa').textContent = 'Empresa não encontrada';
              document.getElementById('cnpj-empresa').textContent = 'N/A';
            }
          } else {
            document.getElementById('nome-empresa').textContent = 'Erro ao carregar';
            document.getElementById('cnpj-empresa').textContent = 'N/A';
          }
        } else {
          document.getElementById('nome-empresa').textContent = 'Não vinculado';
          document.getElementById('cnpj-empresa').textContent = 'N/A';
        }
      } catch (error) {
        console.error('Erro ao carregar perfil:', error);
        document.getElementById('nome-empresa').textContent = 'Erro ao carregar';
        document.getElementById('cnpj-empresa').textContent = 'N/A';
      }
    }

    function formatarCNPJ(cnpj) {
      if (!cnpj) return '';
      cnpj = cnpj.replace(/\D/g, '');
      return cnpj.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
    }
  </script>
</body>
</html>
